name: VoiceLine Local64 direct downloads

on:
  push:
    branches: [build/android-apk]
    paths: [.github/workflows/publish-local64-download.yml]
  workflow_dispatch:

permissions: {}

jobs:
  downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: voiceline-local64-ci
      SOURCE_RUN_ID: '41464510897'
      SOURCE_COMMIT: 610d763a5b2395bb38601ed9734d239829b13f44
      APK_SHA256: 1e66a0154e47a82d35784cd90b2497b58cf233965984c8d57586ec8e26f0b9b5
    steps:
      - name: Verify the exact successful source build
        run: |
          gh run watch "$SOURCE_RUN_ID" --repo "$GH_REPO" --exit-status --interval 10
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" > source-run.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(Path('source-run.json').read_text())
          assert run['conclusion'] == 'success', run['conclusion']
          assert run['head_sha'] == os.environ['SOURCE_COMMIT'], run['head_sha']
          PY
      - name: Download and verify the already tested APK
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "$GH_REPO" --name VoiceLine-Local64-APKs --dir dist
          python3 - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          dist = Path('dist')
          apk = dist / 'VoiceLine-Local64-CI.apk'
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == os.environ['APK_SHA256']
          with zipfile.ZipFile(apk) as archive:
              assert archive.testzip() is None
          info = (dist / 'BUILD_INFO.txt').read_text()
          assert os.environ['SOURCE_COMMIT'] in info
          assert 'com.voiceline.app.local18.ci45' in info
          package = dist / 'VoiceLine-Local64-CI.zip'
          with zipfile.ZipFile(package, 'w', zipfile.ZIP_DEFLATED) as archive:
              entry = zipfile.ZipInfo(apk.name, date_time=(2026, 11, 2, 0, 0, 0))
              entry.compress_type = zipfile.ZIP_DEFLATED
              archive.writestr(entry, apk.read_bytes())
          sums = [hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name
                  for p in [apk, package]]
          (dist / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n')
          PY
      - name: Create public test download links
        run: |
          cat > release-notes.md <<'NOTES'
          ## VoiceLine Local64 · 상세 설정 통합

          - 일반 연습과 루틴의 공통 연습 설정, 적용 범위와 현재 값 요약
          - 연습 내용·진행 시간/반복·소리/측정 그룹과 실제 진행 순서·전체/발성 시간
          - 횟수 지정/계속 반복, 직접 중단/시간 지정, 초 입력/BPM을 명확한 선택지로 제공
          - 청음 직접 지정과 1~20음 설정, 비브라토 기준음·청음·메트로놈 저장 복원 개선
          - 루틴은 한 단계씩 편집하며 각 단계와 전체 반복의 총시간 확인
          - 아에이오우는 각 모음마다 고정 목표음의 음계를 왕복하며, 연속 슬라이드와 분리
          - 큰 건반·훈련 그래프 배치와 하나의 시작/중단 버튼 유지
          - 342개 회귀 검사, 63개 화면 구성, 105개 강약 미리보기와 공통 설정/실제 루틴 검사 통과
          - 버전 2.0.0-local64-ci (79), 설치 이름 VoiceLine
          - 기존 Local63 테스트 앱을 삭제하지 않고 업데이트 설치

          APK 다운로드가 막히면 ZIP을 받아 압축을 푼 뒤 APK를 실행하세요. 실제 휴대폰 검사는 별도로 필요하며 Play Console 업로드·심사 제출은 수행하지 않았습니다.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "$GH_REPO" --clobber dist/VoiceLine-Local64-CI.apk dist/VoiceLine-Local64-CI.zip dist/BUILD_INFO.txt dist/APK_LABEL_VERIFIED.json dist/SHA256SUMS.txt
          else
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$SOURCE_COMMIT" --prerelease --title 'VoiceLine Local64 상세 설정 통합 APK' --notes-file release-notes.md dist/VoiceLine-Local64-CI.apk dist/VoiceLine-Local64-CI.zip dist/BUILD_INFO.txt dist/APK_LABEL_VERIFIED.json dist/SHA256SUMS.txt
          fi
      - name: Verify public downloads without authentication
        run: |
          mkdir -p "$RUNNER_TEMP/public-download-check"
          for filename in VoiceLine-Local64-CI.apk VoiceLine-Local64-CI.zip; do
            curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 --output "$RUNNER_TEMP/public-download-check/$filename" "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$filename"
          done
          cd "$RUNNER_TEMP/public-download-check"
          sha256sum --check "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"
      - name: Verify public privacy policy without authentication
        run: |
          curl --fail --location --retry 2 --retry-all-errors --max-time 45 --output "$RUNNER_TEMP/voiceline-public-policy.html" 'https://mindup-studio.pages.dev/apps/voiceline/privacy.html'
          python3 - <<'PY_POLICY'
          import os
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'voiceline-public-policy.html').read_text()
          assert 'VoiceLine 개인정보처리방침' in text
          assert '마이크' in text and '마인드업 스튜디오' in text and 'grand4870@gmail.com' in text
          PY_POLICY
