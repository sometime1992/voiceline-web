name: VoiceLine Local65 direct downloads

on:
  push:
    branches: [build/android-apk]
    paths: [.github/workflows/publish-local65-download.yml]
  workflow_dispatch:

permissions: {}

jobs:
  downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: voiceline-local65-ci
      SOURCE_RUN_ID: '41482138781'
      SOURCE_COMMIT: df8d2748a880058cbc77e40b93100bf02778467e
    steps:
      - name: Verify the exact successful source build
        run: |
          gh run watch "$SOURCE_RUN_ID" --repo "$GH_REPO" --exit-status --interval 10
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" > source-run.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(Path('source-run.json').read_text())
          assert run['conclusion'] == 'success', run['conclusion']
          assert run['head_sha'] == os.environ['SOURCE_COMMIT'], run['head_sha']
          PY
      - name: Download and verify the already tested APK
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "$GH_REPO" --name VoiceLine-Local65-APKs --dir dist
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          dist = Path('dist')
          apk = dist / 'VoiceLine-Local65-CI.apk'
          verified = json.loads((dist / 'APK_LABEL_VERIFIED.json').read_text())
          assert verified['source_commit'] == os.environ['SOURCE_COMMIT']
          assert verified['version_name'] == '2.0.0-local65-ci' and verified['version_code'] == 80
          assert verified['package'] == 'com.voiceline.app.local18.ci45'
          assert verified['certificate_sha256'] == 'e0bc85a5900a64eee520a444e80db3844a4b9372c172ab021e0944d239ce429c'
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == verified['apk_sha256']
          with zipfile.ZipFile(apk) as archive:
              assert archive.testzip() is None
          info = (dist / 'BUILD_INFO.txt').read_text()
          assert os.environ['SOURCE_COMMIT'] in info
          assert 'com.voiceline.app.local18.ci45' in info
          package = dist / 'VoiceLine-Local65-CI.zip'
          with zipfile.ZipFile(package, 'w', zipfile.ZIP_DEFLATED) as archive:
              entry = zipfile.ZipInfo(apk.name, date_time=(2026, 11, 3, 0, 0, 0))
              entry.compress_type = zipfile.ZIP_DEFLATED
              archive.writestr(entry, apk.read_bytes())
          sums = [hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name
                  for p in [apk, package]]
          (dist / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n')
          PY
      - name: Create public test download links
        run: |
          cat > release-notes.md <<'NOTES'
          ## VoiceLine Local65 · 가로·세로 가독성과 듣기 중 건반 표시

          - 제목·편집 본문·저장 영역 분리: 저장 버튼이 내용을 가리지 않음
          - 가로는 요약 옆 편집, 세로는 짧은 요약 아래 편집
          - 진행 순서·전체 음 목록은 펼쳐 보기, 빈 루틴 도구 영역 제거
          - 큰 글자와 화면 키보드에서 입력·오류·저장 버튼 접근 확인
          - 일반 설정과 루틴의 같은 편집 구조, 새로 열 때 스크롤 초기화
          - 설명·기록 화면의 제목·닫기·본문 가림 개선
          - 듣기·호흡 준비에 보라색 감지 건반을 숨기고 발성 시작 이후의 새 입력부터 표시
          - 마이크 연결·녹음·채점과 실제 발성 중 안내음 구간의 입력 유지
          - 347개 회귀 검사, 185개 설정 가독성, 21개 공통 설정·루틴 실행 검사
          - 큰 건반·가로 반투명 그래프·세로 그래프/건반 배치 유지
          - 앱 소스: https://github.com/sometime1992/voiceline-web/commit/df8d2748a880058cbc77e40b93100bf02778467e
          - 버전 2.0.0-local65-ci (80), 설치 이름 VoiceLine
          - 기존 Local64 테스트 앱을 삭제하지 않고 업데이트 설치

          APK 다운로드가 막히면 ZIP을 받아 압축을 푼 뒤 APK를 실행하세요. 실제 휴대폰 검사는 별도로 필요하며 Play Console 업로드·심사 제출은 수행하지 않았습니다.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --prerelease --title 'VoiceLine Local65 가로·세로 가독성 수정 APK' --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" --repo "$GH_REPO" --clobber dist/VoiceLine-Local65-CI.apk dist/VoiceLine-Local65-CI.zip dist/BUILD_INFO.txt dist/APK_LABEL_VERIFIED.json dist/SHA256SUMS.txt
          else
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$SOURCE_COMMIT" --prerelease --title 'VoiceLine Local65 가로·세로 가독성 수정 APK' --notes-file release-notes.md dist/VoiceLine-Local65-CI.apk dist/VoiceLine-Local65-CI.zip dist/BUILD_INFO.txt dist/APK_LABEL_VERIFIED.json dist/SHA256SUMS.txt
          fi
      - name: Verify public downloads without authentication
        run: |
          mkdir -p "$RUNNER_TEMP/public-download-check"
          for filename in VoiceLine-Local65-CI.apk VoiceLine-Local65-CI.zip; do
            curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 --output "$RUNNER_TEMP/public-download-check/$filename" "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$filename"
          done
          cd "$RUNNER_TEMP/public-download-check"
          sha256sum --check "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"
      - name: Verify public privacy policy without authentication
        run: |
          curl --fail --location --retry 2 --retry-all-errors --max-time 45 --output "$RUNNER_TEMP/voiceline-public-policy.html" 'https://mindup-studio.pages.dev/apps/voiceline/privacy.html'
          python3 - <<'PY_POLICY'
          import os
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'voiceline-public-policy.html').read_text()
          assert 'VoiceLine 개인정보처리방침' in text
          assert '마이크' in text and '마인드업 스튜디오' in text and 'grand4870@gmail.com' in text
          PY_POLICY
