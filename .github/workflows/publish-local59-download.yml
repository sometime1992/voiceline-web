name: VoiceLine Local59 direct downloads

on:
  push:
    branches: [build/android-apk]
    paths: [.github/workflows/publish-local59-download.yml]
  workflow_dispatch:

permissions: {}

jobs:
  downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: voiceline-local59-ci
      SOURCE_RUN_ID: '41375131526'
      SOURCE_COMMIT: 233a10c9b31f846cc3ece95a90fda59607ebeffe
      APK_SHA256: 6017402ae18bb1bfa3e96faed800142481dd6118a1df57f1787a6562c883dc8a
    steps:
      - name: Verify the exact successful source build
        run: |
          gh run watch "$SOURCE_RUN_ID" --repo "$GH_REPO" --exit-status --interval 10
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" > source-run.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(Path('source-run.json').read_text())
          assert run['conclusion'] == 'success', run['conclusion']
          assert run['head_sha'] == os.environ['SOURCE_COMMIT'], run['head_sha']
          PY
      - name: Download and verify the already tested APK
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "$GH_REPO" --name VoiceLine-Local59-APKs --dir dist
          python3 - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          dist = Path('dist')
          apk = dist / 'VoiceLine-Local59-CI.apk'
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == os.environ['APK_SHA256']
          with zipfile.ZipFile(apk) as archive:
              assert archive.testzip() is None
          info = (dist / 'BUILD_INFO.txt').read_text()
          assert os.environ['SOURCE_COMMIT'] in info
          assert 'com.voiceline.app.local18.ci45' in info
          package = dist / 'VoiceLine-Local59-CI.zip'
          with zipfile.ZipFile(package, 'w', zipfile.ZIP_DEFLATED) as archive:
              entry = zipfile.ZipInfo(apk.name, date_time=(2026, 11, 2, 0, 0, 0))
              entry.compress_type = zipfile.ZIP_DEFLATED
              archive.writestr(entry, apk.read_bytes())
          sums = [hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name
                  for p in [apk, package]]
          (dist / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n')
          PY
      - name: Create public test download links
        run: |
          cat > release-notes.md <<'NOTES'
          ## VoiceLine Local59 · 연습 메뉴 정렬

          - 나의 루틴을 기존 사용법 위치인 왼쪽 칸으로 이동
          - 사용법을 나의 기록 바로 아래 오른쪽 칸으로 이동
          - 나의 루틴과 사용법을 한 줄로 정렬, 개인정보처리방침은 다음 줄 전체 너비 유지
          - 버전 2.0.0-local59-ci (74), 설치 이름 VoiceLine
          - C3 기준음, 직접 시간 설정과 무한 반복, 저장한 루틴 기능 유지
          - 기존 Local58 테스트 앱에 삭제 없이 업데이트 설치

          기존 앱을 삭제하지 말고 이 APK로 업데이트 설치하세요. 이 파일은 설치 테스트용이며 Play 업로드용 서명 AAB는 별도입니다.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "$GH_REPO" --clobber dist/VoiceLine-Local59-CI.apk dist/VoiceLine-Local59-CI.zip dist/BUILD_INFO.txt dist/APK_LABEL_VERIFIED.json dist/SHA256SUMS.txt
          else
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$SOURCE_COMMIT" --prerelease --title 'VoiceLine Local59 메뉴 정렬 APK' --notes-file release-notes.md dist/VoiceLine-Local59-CI.apk dist/VoiceLine-Local59-CI.zip dist/BUILD_INFO.txt dist/APK_LABEL_VERIFIED.json dist/SHA256SUMS.txt
          fi
      - name: Verify public downloads without authentication
        run: |
          mkdir -p "$RUNNER_TEMP/public-download-check"
          for filename in VoiceLine-Local59-CI.apk VoiceLine-Local59-CI.zip; do
            curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 --output "$RUNNER_TEMP/public-download-check/$filename" "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$filename"
          done
          cd "$RUNNER_TEMP/public-download-check"
          sha256sum --check "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"
      - name: Verify public privacy policy without authentication
        run: |
          curl --fail --location --retry 2 --retry-all-errors --max-time 45 --output "$RUNNER_TEMP/voiceline-public-policy.html" 'https://mindup-studio.pages.dev/apps/voiceline/privacy.html'
          python3 - <<'PY_POLICY'
          import os
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'voiceline-public-policy.html').read_text()
          assert 'VoiceLine 개인정보처리방침' in text
          assert '마이크' in text and '마인드업 스튜디오' in text and 'grand4870@gmail.com' in text
          PY_POLICY
