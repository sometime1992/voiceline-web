name: VoiceLine Local69 direct downloads

on:
  push:
    branches: [build/android-apk]
    paths: [.github/workflows/publish-local69-download.yml]
  workflow_dispatch:

permissions: {}

jobs:
  downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: voiceline-local69-ci
      SOURCE_RUN_ID: '41567019566'
      SOURCE_COMMIT: a2c78522757b812f2e432d45a1e1db7f8b6d763f
      ANDROID_RUN_ID: '41569065425'
      ANDROID_COMMIT: 64111def1b55effa4c2cd2e257b935730f2ff3ea
    steps:
      - name: Verify complete app checks and exact APK Android results
        run: |
          gh run watch "$ANDROID_RUN_ID" --repo "$GH_REPO" --exit-status --interval 10
          gh api "repos/$GH_REPO/compare/$SOURCE_COMMIT...$GITHUB_SHA" > publication-compare.json
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" > source-run.json
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID/jobs" > source-jobs.json
          gh api "repos/$GH_REPO/actions/runs/$ANDROID_RUN_ID" > android-run.json
          gh run download "$ANDROID_RUN_ID" --repo "$GH_REPO" --name VoiceLine-Local69-Android-Verified --dir android-verified
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          comparison=json.loads(Path('publication-compare.json').read_text())
          assert comparison['status'] in ('ahead','identical')
          assert not any(f['filename'].startswith('android-local44/') for f in comparison['files']), 'App changed since verification'
          run=json.loads(Path('source-run.json').read_text())
          assert run['head_sha']==os.environ['SOURCE_COMMIT']
          jobs=json.loads(Path('source-jobs.json').read_text())['jobs']
          steps=next(j['steps'] for j in jobs if j['name']=='apk')
          required=['Verify public studio homepage, privacy and support','Test recording, dynamics calibration, training and adaptive layout','Check every keyboard size and live graph in Chromium','Build separately installable CI APK','Verify signatures, package IDs, version and every offline asset','Check unsigned release AAB and Android lint','Verify release-review bundle assets','Validate production bundle and prepare emulator review APK']
          for name in required:assert next(s for s in steps if s['name']==name)['conclusion']=='success',name
          assert [s['name'] for s in steps if s['conclusion']=='failure']==['Android 16 production smoke test and store screenshots']
          native=json.loads(Path('android-run.json').read_text())
          assert native['conclusion']=='success' and native['head_sha']==os.environ['ANDROID_COMMIT']
          qa=Path('android-verified/android-smoke')
          facts=json.loads((qa/'EXACT_APK_VERIFICATION.json').read_text())
          assert facts['status']=='passed' and facts['app_sources_unchanged'] is True
          assert facts['app_source_commit']==os.environ['SOURCE_COMMIT']
          assert str(facts['verification_run'])==os.environ['ANDROID_RUN_ID'] and facts['verification_commit']==os.environ['ANDROID_COMMIT']
          assert facts['apk_sha256']=='f9bbad9014a724efcf570cc4e2908b27fc558dd36f6977610f3c4539965c2938'
          assert json.loads((qa/'ANDROID16_SMOKE.json').read_text())['status']=='passed'
          update=json.loads((qa/'CI_INSTALL_NAME.json').read_text())
          assert update['update_installed_without_uninstall'] and update['private_test_file_preserved']
          PY
      - name: Download and verify the already tested APK
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "$GH_REPO" --name VoiceLine-Local69-APKs --dir dist
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          dist = Path('dist')
          apk = dist / 'VoiceLine-Local69-CI.apk'
          verified = json.loads((dist / 'APK_LABEL_VERIFIED.json').read_text())
          assert verified['source_commit'] == os.environ['SOURCE_COMMIT']
          assert verified['version_name'] == '2.0.0-local69-ci' and verified['version_code'] == 84
          assert verified['package'] == 'com.voiceline.app.local18.ci45'
          assert verified['certificate_sha256'] == 'e0bc85a5900a64eee520a444e80db3844a4b9372c172ab021e0944d239ce429c'
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == verified['apk_sha256'] == 'f9bbad9014a724efcf570cc4e2908b27fc558dd36f6977610f3c4539965c2938'
          with zipfile.ZipFile(apk) as archive:
              assert archive.testzip() is None
          info = (dist / 'BUILD_INFO.txt').read_text()
          assert os.environ['SOURCE_COMMIT'] in info
          assert 'com.voiceline.app.local18.ci45' in info
          package = dist / 'VoiceLine-Local69-CI.zip'
          with zipfile.ZipFile(package, 'w', zipfile.ZIP_DEFLATED) as archive:
              entry = zipfile.ZipInfo(apk.name, date_time=(2026, 11, 3, 0, 0, 0))
              entry.compress_type = zipfile.ZIP_DEFLATED
              archive.writestr(entry, apk.read_bytes())
          sums = [hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name
                  for p in [apk, package]]
          (dist / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n')
          PY
      - name: Create public test download links
        run: |
          cat > release-notes.md <<'NOTES'
          ## VoiceLine Local69 · 한 페이지 통합 편집과 밝은 UI

          - 현재 설정 요약과 루틴 구성의 기존 페이지 형식 유지
          - 단계 선택 즉시 모든 설정을 한 페이지에서 직접 수정
          - 호흡·허밍·회복·준비·반복·소리·단계 관리를 입력 카드로 표시
          - 밝은 배경과 짙은 글자, 청록색 동작 버튼으로 앱 전체 표면 개선
          - 메트로놈 숫자·기록·결과·설명창의 연한 글자도 대비 조정
          - 가로는 여러 열, 세로는 화면 폭에 맞는 카드 배치, 좁은 화면은 편집 본문만 스크롤
          - 숫자는 −/+로 조절하고 값을 누를 때만 키보드로 직접 입력
          - 변경 확인 후 다시 수정할 때 입력값과 편집 위치 유지
          - 최종 저장 전에는 실행 설정과 저장값을 변경하지 않음
          - 듣기·호흡 준비 중 보라색 건반 억제와 녹음·채점·마이크 동작 유지
          - 347개 회귀 검사, 254개 화면 흐름, 22개 설정·루틴 실행 검사 통과
          - 가로·세로와 글자 100/120/150%, 주요 글자 대비 4.5 이상 검사
          - Android16에서 단계 바로 편집·확인 후 복귀·큰 글자·직접 입력·저장 재열기 검증
          - 앱 소스: https://github.com/sometime1992/voiceline-web/commit/a2c78522757b812f2e432d45a1e1db7f8b6d763f
          - 버전 2.0.0-local69-ci (84), 설치 이름 VoiceLine
          - Local68에서 삭제 없는 업데이트 설치와 내부 시험 파일 보존 확인

          APK 다운로드가 막히면 ZIP을 받아 압축을 푼 뒤 APK를 실행하세요. 실제 휴대폰 검사는 별도로 필요하며 Play Console 업로드·심사 제출은 수행하지 않았습니다.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --prerelease --title 'VoiceLine Local69 통합 편집·밝은 UI APK' --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" --repo "$GH_REPO" --clobber dist/VoiceLine-Local69-CI.apk dist/VoiceLine-Local69-CI.zip dist/BUILD_INFO.txt dist/APK_LABEL_VERIFIED.json dist/SHA256SUMS.txt
          else
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --prerelease --title 'VoiceLine Local69 통합 편집·밝은 UI APK' --notes-file release-notes.md dist/VoiceLine-Local69-CI.apk dist/VoiceLine-Local69-CI.zip dist/BUILD_INFO.txt dist/APK_LABEL_VERIFIED.json dist/SHA256SUMS.txt
          fi
      - name: Verify public downloads without authentication
        run: |
          mkdir -p "$RUNNER_TEMP/public-download-check"
          for filename in VoiceLine-Local69-CI.apk VoiceLine-Local69-CI.zip; do
            curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 --output "$RUNNER_TEMP/public-download-check/$filename" "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$filename"
          done
          cd "$RUNNER_TEMP/public-download-check"
          sha256sum --check "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"
      - name: Verify public privacy policy without authentication
        run: |
          curl --fail --location --retry 2 --retry-all-errors --max-time 45 --output "$RUNNER_TEMP/voiceline-public-policy.html" 'https://mindup-studio.pages.dev/apps/voiceline/privacy.html'
          python3 - <<'PY_POLICY'
          import os
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'voiceline-public-policy.html').read_text()
          assert 'VoiceLine 개인정보처리방침' in text
          assert '마이크' in text and '마인드업 스튜디오' in text and 'grand4870@gmail.com' in text
          PY_POLICY
