name: VoiceLine Local89 - clean piano APK
on:
  push:
    branches: [build/android-apk]
    paths:
      - android-local44/**
      - .github/workflows/build-local89-clean-apk.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VOICELINE_CI_KEYSTORE: ${{ github.workspace }}/.ci-signing/debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Audit song removal and preserved piano
        shell: bash
        run: |
          test -s android-local44/app/src/main/assets/www/vendor/tone-piano.js
          grep -q 'id="keyboard"' android-local44/app/src/main/assets/www/index.html
          grep -q 'id="studioYoutubeLink"' android-local44/app/src/main/assets/www/index.html
          ! grep -q 'song-practice.js' android-local44/app/src/main/assets/www/index.html
          ! grep -q 'songGraphOverlay' android-local44/app/src/main/assets/www/index.html
          test ! -e android-local44/app/src/main/assets/www/song-practice.js
          test ! -e android-local44/app/src/main/assets/www/song-practice.css
          test ! -e android-local44/app/src/main/java/com/voiceline/app/SongPlaybackBridge.java
          test ! -e android-local44/app/src/main/java/com/voiceline/app/LocalMrReducer.java
          node --check android-local44/app/src/main/assets/www/piano.js
          ! grep -q "song-practice" android-local44/app/src/main/assets/www/sw.js
      - name: Ensure Android SDK
        shell: bash
        run: |
          manager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -x "$manager"
          yes | "$manager" --licenses >/dev/null || true
          "$manager" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Restore pinned CI signing key
        uses: actions/cache@v4
        with:
          path: ${{ env.VOICELINE_CI_KEYSTORE }}
          key: voiceline-ci45-debug-signing-v1
      - name: Require original signing key
        shell: bash
        run: |
          test -s "$VOICELINE_CI_KEYSTORE" || { echo "::error::Refusing to change the previous app's signing certificate"; exit 1; }
      - name: Assemble CI APK without song feature
        working-directory: android-local44
        run: gradle --no-daemon :app:assembleCiDebug
      - name: Validate app, copyright notices and signing
        shell: bash
        run: |
          mkdir -p dist
          apk="$(find android-local44/app/build/outputs/apk/ciDebug -name '*.apk' -print -quit)"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "name='com.voiceline.app.local18.ci45'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "versionCode='112'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "versionName='2.0.0-local89-ci'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | tee dist/signing.txt
          grep -qi "$(cat ci/android-debug-cert.sha256)" dist/signing.txt
          python3 - "$apk" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              for name in ['assets/www/index.html','assets/www/piano.js','assets/www/vendor/salamander/C4v8.mp3','assets/www/THIRD-PARTY-NOTICES.txt']:
                  assert name in names, name
              for name in ['assets/www/song-practice.js','assets/www/song-practice.css']:
                  assert name not in names, name
              assert b'id="keyboard"' in z.read('assets/www/index.html')
              assert b'id="studioYoutubeLink"' in z.read('assets/www/index.html')
              assert b'songGraphOverlay' not in z.read('assets/www/index.html')
          PY
          cp "$apk" dist/VoiceLine-Local89-Clean-CI.apk
          sha256sum dist/VoiceLine-Local89-Clean-CI.apk > dist/SHA256SUMS.txt
          (cd dist && zip -q VoiceLine-Local89-Clean-CI.zip VoiceLine-Local89-Clean-CI.apk)
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceLine-Local89-Clean-APK
          path: dist/
          retention-days: 7
      - name: Release direct-download APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag=voiceline-local89-clean-ci
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'VoiceLine Local89 - Original Piano UI, Song Feature Removed' \
              --notes 'Song following, external audio/MR import, song pitch extraction and native song playback have been removed. All original piano, recording, vibrato, metronome and exercises remain. Naruvium YouTube link stays at the bottom of the menu. Same CI signing certificate as previous Local88, versionCode 112. Copyright provenance audit: see android-local44/docs/local89-copyright-review.md. No guarantee of zero third-party rights risk.' \
              dist/VoiceLine-Local89-Clean-CI.apk dist/VoiceLine-Local89-Clean-CI.zip dist/SHA256SUMS.txt
          fi
