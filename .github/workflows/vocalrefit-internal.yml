name: VocalRefit signed internal test bundle

# Builds the Play upload bundle (AAB) signed with the existing upload key.
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VOICELINE_UPLOAD_KEYSTORE_BASE64  base64 of voiceline-upload.p12
#   VOICELINE_UPLOAD_STORE_PASSWORD   keystore password
#   VOICELINE_UPLOAD_KEY_PASSWORD     optional; omit if same as the store password
# The key alias is fixed to voiceline-upload.

on:
  push:
    branches: [build/vocalrefit-internal-116, build/vocalrefit-internal-117]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vocalrefit-internal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run app tests
        run: npm test --prefix android-local44

      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'

      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.VOICELINE_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret VOICELINE_UPLOAD_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/voiceline-upload.p12"
          echo "VOICELINE_UPLOAD_KEYSTORE=$RUNNER_TEMP/voiceline-upload.p12" >> "$GITHUB_ENV"

      - name: Build signed release bundle
        working-directory: android-local44
        env:
          VOICELINE_UPLOAD_STORE_PASSWORD: ${{ secrets.VOICELINE_UPLOAD_STORE_PASSWORD }}
          VOICELINE_UPLOAD_KEY_PASSWORD: ${{ secrets.VOICELINE_UPLOAD_KEY_PASSWORD }}
          VOICELINE_UPLOAD_KEY_ALIAS: voiceline-upload
        run: |
          # An empty key password falls back to the store password in app/build.gradle.
          if [ -z "$VOICELINE_UPLOAD_KEY_PASSWORD" ]; then unset VOICELINE_UPLOAD_KEY_PASSWORD; fi
          gradle --no-daemon :app:bundleRelease :app:lintRelease

      - name: Verify license notices
        run: python3 ci/verify-third-party-notices.py android-local44/app/build/outputs/bundle/release/app-release.aab

      - name: Verify the bundle is signed
        run: |
          AAB=android-local44/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" | grep -q "jar verified" || { echo "::error::The bundle is not signed."; exit 1; }
          ACTUAL=$(keytool -printcert -jarfile "$AAB" | grep -m1 'SHA256:' | sed 's/.*SHA256: //' | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          echo "Upload certificate SHA-256: $ACTUAL"
          echo "### Upload certificate SHA-256" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$ACTUAL\`" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$AAB"

      - name: Remove upload key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/voiceline-upload.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: VocalRefit-2.0.0-117-signed-upload
          path: android-local44/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
