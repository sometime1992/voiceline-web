name: VocalRefit internal test bundle
on:
  push:
    branches: [build/vocalrefit-internal-116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: npm test --prefix android-local44
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: gradle --no-daemon :app:bundleRelease :app:lintRelease
        working-directory: android-local44
      - run: python3 ci/verify-third-party-notices.py android-local44/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: VocalRefit-116-unsigned
          path: android-local44/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
