name: VoiceLine Local72 direct downloads

on:
  push:
    branches: [build/android-apk]
    paths: [.github/workflows/publish-local72-download.yml]
  workflow_dispatch:

permissions: {}

jobs:
  downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: voiceline-local72-ci
      SOURCE_RUN_ID: '41612317822'
      SOURCE_COMMIT: e6bb87264face0fd5c2418bf2863eb0eb9ae4b57
      ANDROID_RUN_ID: '41616374279'
      ANDROID_COMMIT: e69bc647667a7e6581019ce1a0019943bd0552e4
    steps:
      - name: Verify complete build and Android results before publishing
        run: |
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" > source-run.json
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID/jobs" > source-jobs.json
          gh api "repos/$GH_REPO/compare/$SOURCE_COMMIT...$GITHUB_SHA" > publication-compare.json
          gh api "repos/$GH_REPO/actions/runs/$ANDROID_RUN_ID" > android-run.json
          gh api "repos/$GH_REPO/actions/runs/$ANDROID_RUN_ID/jobs" > android-jobs.json
          gh run download "$ANDROID_RUN_ID" --repo "$GH_REPO" --name VoiceLine-Local72-Android-Verified --dir verified-media
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run=json.loads(Path('source-run.json').read_text())
          assert run['head_sha']==os.environ['SOURCE_COMMIT']
          assert run['status']=='completed' and run['conclusion']=='failure'
          android=json.loads(Path('android-run.json').read_text())
          assert android['head_sha']==os.environ['ANDROID_COMMIT']
          assert android['status']=='completed' and android['conclusion']=='success'
          comparison=json.loads(Path('publication-compare.json').read_text())
          assert comparison['status'] in ('ahead','identical')
          assert not any(f['filename'].startswith('android-local44/') for f in comparison['files']), 'App changed since verification'
          jobs=json.loads(Path('source-jobs.json').read_text())['jobs']
          steps=next(j['steps'] for j in jobs if j['name']=='apk')
          required=['Verify public studio homepage, privacy and support','Test recording, dynamics calibration, training and adaptive layout','Check every keyboard size and live graph in Chromium','Build separately installable CI APK','Verify signatures, package IDs, version and every offline asset','Check unsigned release AAB and Android lint','Verify release-review bundle assets','Validate production bundle and prepare emulator review APK']
          for name in required:
              assert next(s for s in steps if s['name']==name)['conclusion']=='success',name
          assert [s['name'] for s in steps if s['conclusion']=='failure']==['Android 16 production smoke test and store screenshots']
          android_jobs=json.loads(Path('android-jobs.json').read_text())['jobs']
          android_steps=next(j['steps'] for j in android_jobs if j['name']=='android')
          for name in ['Verify the exact APK in Android 16','Verify all store media dimensions']:
              assert next(s for s in android_steps if s['name']==name)['conclusion']=='success',name
          qa=Path('verified-media/android-smoke')
          exact=json.loads((qa/'EXACT_APK_VERIFICATION.json').read_text())
          assert exact['status']=='passed' and exact['app_sources_unchanged']
          assert exact['app_source_commit']==os.environ['SOURCE_COMMIT']
          assert exact['app_build_run']==os.environ['SOURCE_RUN_ID']
          assert exact['apk_sha256']=='14dec1d732a5520e6d69879d172590015a7a9e5a3386b333c1683bb9ab57513a'
          assert json.loads((qa/'ANDROID16_SMOKE.json').read_text())['status']=='passed'
          update=json.loads((qa/'CI_INSTALL_NAME.json').read_text())
          assert update['status']=='passed'
          assert update['before_version']=='2.0.0-local71-ci (86)'
          assert update['after_version']=='2.0.0-local72-ci (87)'
          assert update['update_installed_without_uninstall'] and update['private_test_file_preserved']
          PY
      - name: Download and verify the exact tested APK
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "$GH_REPO" --name VoiceLine-Local72-APKs --dir dist
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          dist=Path('dist')
          apk=dist/'VoiceLine-Local72-CI.apk'
          verified=json.loads((dist/'APK_LABEL_VERIFIED.json').read_text())
          assert verified['source_commit']==os.environ['SOURCE_COMMIT']
          assert verified['version_name']=='2.0.0-local72-ci' and verified['version_code']==87
          assert verified['package']=='com.voiceline.app.local18.ci45'
          assert verified['certificate_sha256']=='e0bc85a5900a64eee520a444e80db3844a4b9372c172ab021e0944d239ce429c'
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==verified['apk_sha256']
          with zipfile.ZipFile(apk) as archive:
              assert archive.testzip() is None
          assert os.environ['SOURCE_COMMIT'] in (dist/'BUILD_INFO.txt').read_text()
          package=dist/'VoiceLine-Local72-CI.zip'
          with zipfile.ZipFile(package,'w',zipfile.ZIP_DEFLATED) as archive:
              entry=zipfile.ZipInfo(apk.name,date_time=(2026,11,3,0,0,0))
              entry.compress_type=zipfile.ZIP_DEFLATED
              archive.writestr(entry,apk.read_bytes())
          (dist/'SHA256SUMS.txt').write_text('\n'.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name for p in [apk,package])+'\n')
          PY
      - name: Create public test download links
        run: |
          cat > release-notes.md <<'NOTES'
          ## VoiceLine Local72 · B안 반투명 설정 팝업

          - 승인된 B안을 현재 앱 색상에 맞춘 반투명 남색 팝업으로 구현
          - 배경의 피아노·그래프가 보이는 여백, 둥근 모서리, 민트색 버튼
          - 루틴은 번호가 있는 세로 목록, 선택한 단계의 관리 버튼만 펼침
          - 단계 상세설정은 그룹별 행과 숫자 조절 버튼으로 한 페이지 편집
          - 단계 추가·이동·삭제는 구성에서 관리하고 적용 완료 후 구성으로 복귀
          - 100/120/150%·가로/세로·키보드·저장·Android16·업데이트 설치 검증
          - 일반 화면·훈련·녹음·채점 및 네이티브 소스 유지
          - 버전 2.0.0-local72-ci (87), 기존 CI 인증서·패키지 유지

          앱 소스: https://github.com/sometime1992/voiceline-web/commit/e6bb87264face0fd5c2418bf2863eb0eb9ae4b57
          빌드·화면 검사: https://github.com/sometime1992/voiceline-web/actions/runs/41612317822
          동일 APK Android16 재검증: https://github.com/sometime1992/voiceline-web/actions/runs/41616374279

          첫 실행은 에뮬레이터 연결 끊김으로 종료되어, 앱 파일을 변경하지 않고 동일 APK를 새 환경에서 재검증했습니다.

          APK 다운로드가 막히면 ZIP을 풀어 안의 동일 APK를 설치하세요. 기존 CI 앱 위에 업데이트 설치합니다. 실제 S24 Ultra 실기기 검사는 수행하지 않았습니다.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --prerelease --title 'VoiceLine Local72 반투명 설정 팝업 APK' --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" --repo "$GH_REPO" --clobber dist/VoiceLine-Local72-CI.apk dist/VoiceLine-Local72-CI.zip dist/BUILD_INFO.txt dist/APK_LABEL_VERIFIED.json dist/SHA256SUMS.txt
          else
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --prerelease --title 'VoiceLine Local72 반투명 설정 팝업 APK' --notes-file release-notes.md dist/VoiceLine-Local72-CI.apk dist/VoiceLine-Local72-CI.zip dist/BUILD_INFO.txt dist/APK_LABEL_VERIFIED.json dist/SHA256SUMS.txt
          fi
      - name: Verify public downloads without authentication
        run: |
          mkdir -p "$RUNNER_TEMP/public-download-check"
          for filename in VoiceLine-Local72-CI.apk VoiceLine-Local72-CI.zip; do
            curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 --output "$RUNNER_TEMP/public-download-check/$filename" "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$filename"
          done
          cd "$RUNNER_TEMP/public-download-check"
          sha256sum --check "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"
      - name: Keep the verified public download files
        uses: actions/upload-artifact@v7
        with:
          name: VoiceLine-Local72-Public-Downloads
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
