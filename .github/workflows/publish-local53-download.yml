name: VoiceLine Local53 direct downloads

on:
  push:
    branches: [build/android-apk]
    paths: [.github/workflows/publish-local53-download.yml]
  workflow_dispatch:

permissions: {}

jobs:
  downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: voiceline-local53-ci
      SOURCE_RUN_ID: '41261409287'
      SOURCE_COMMIT: 87c1e704157420bf676c33743fe8de1493e0d28b
      APK_SHA256: 04c10d17cbe0e409aec54cce550038e9d0c9130cb7b0f84dabb77f6d75a4ec88
    steps:
      - name: Verify the exact successful source build
        run: |
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" > source-run.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(Path('source-run.json').read_text())
          assert run['conclusion'] == 'success', run['conclusion']
          assert run['head_sha'] == os.environ['SOURCE_COMMIT'], run['head_sha']
          PY
      - name: Download and verify the already tested APK
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "$GH_REPO" --name VoiceLine-Local53-APKs --dir dist
          python3 - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          dist = Path('dist')
          apk = dist / 'VoiceLine-Local53-CI.apk'
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == os.environ['APK_SHA256']
          with zipfile.ZipFile(apk) as archive:
              assert archive.testzip() is None
          info = (dist / 'BUILD_INFO.txt').read_text()
          assert os.environ['SOURCE_COMMIT'] in info
          assert 'com.voiceline.app.local18.ci45' in info
          package = dist / 'VoiceLine-Local53-CI.zip'
          with zipfile.ZipFile(package, 'w', zipfile.ZIP_DEFLATED) as archive:
              entry = zipfile.ZipInfo(apk.name, date_time=(2026, 11, 1, 0, 0, 0))
              entry.compress_type = zipfile.ZIP_DEFLATED
              archive.writestr(entry, apk.read_bytes())
          sums = [hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name
                  for p in [apk, package]]
          (dist / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n')
          PY
      - name: Create public test download links
        run: |
          cat > release-notes.md <<'NOTES'
          ## 보이스라인 Local53 테스트 APK

          아래 Assets에서 APK 또는 ZIP을 받아 기존 앱에 업데이트 설치하세요.

          - 기준음·피아노·메트로놈 음량 100%에서 막대 끝까지 채움
          - 강약 연습 7가지: 기본 4단계, 점점 크게, 점점 작게, 커졌다 작아지기, 강약 반복, 일정하게 유지, 짧게 강조
          - 선택한 방법의 목표 그래프·허용 범위·단계 안내·안내음·채점을 연동
          - 연습 방법 저장 및 완료한 그래프 확인
          - 자동 검사 285개, 가로·세로 화면 배치 63건과 연습 방법 미리보기 21건 통과
          - 실제 음성 입력으로 단계형·점진형 연습 완료와 채점 확인
          - APK 서명과 모든 내장 파일 47개 검증 완료

          기존 CI45~52 앱의 녹음·연습 기록을 유지합니다. 기존 앱에 업데이트 설치하세요.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "$GH_REPO" --clobber dist/VoiceLine-Local53-CI.apk dist/VoiceLine-Local53-CI.zip dist/BUILD_INFO.txt dist/SHA256SUMS.txt
          else
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$SOURCE_COMMIT" --prerelease --title 'VoiceLine Local53 CI45 테스트 APK' --notes-file release-notes.md dist/VoiceLine-Local53-CI.apk dist/VoiceLine-Local53-CI.zip dist/BUILD_INFO.txt dist/SHA256SUMS.txt
          fi
      - name: Verify public downloads without authentication
        run: |
          mkdir -p "$RUNNER_TEMP/public-download-check"
          for filename in VoiceLine-Local53-CI.apk VoiceLine-Local53-CI.zip; do
            curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 --output "$RUNNER_TEMP/public-download-check/$filename" "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$filename"
          done
          cd "$RUNNER_TEMP/public-download-check"
          sha256sum --check "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"
