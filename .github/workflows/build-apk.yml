name: VoiceLine Android phone and tablet APK
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/landscape-piano-v2
      - feature/tonejs-piano-engine
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install published MIT Tone Piano engine and build dependencies
        run: npm install --legacy-peer-deps --no-fund --no-audit
      - name: Test piano application
        run: npm test
      - name: Bundle Salamander Grand piano samples locally under CC BY 3.0
        run: npm run piano:download
      - name: Bundle published piano engine for Android WebView
        run: npm run piano:bundle
      - name: Verify complete offline piano package
        run: |
          node -e "const fs=require('fs');const p='android-app/app/src/main/assets/www/vendor/salamander';const d=JSON.parse(fs.readFileSync(p+'/CREDITS.json'));if(d.files.length!==28||d.files.some(f=>fs.statSync(p+'/'+f).size<10000)||fs.statSync('android-app/app/src/main/assets/www/vendor/tone-piano.js').size<10000)process.exit(1);console.log('Bundled grand piano:',d.files.length,'recordings')"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's hosted Ubuntu runner already provides cmdline-tools and ANDROID_HOME.
      # setup-android@v3 attempts to install the removed legacy "tools" package,
      # so use the existing command-line tools instead.
      - name: Ensure Android SDK 35 packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable Android debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceLine-v2-beta11-tone-piano-engine-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
