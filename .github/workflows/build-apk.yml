name: VoiceLine Android phone and tablet APK
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/landscape-piano-v2
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test piano application
        run: node --test tests/piano.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable Android debug APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceLine-v2-Android-Phone-Tablet-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
