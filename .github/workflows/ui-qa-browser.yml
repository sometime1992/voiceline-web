name: VoiceLine UI QA browser
on:
  push:
    branches: [build/android-apk]
    paths: [.github/workflows/ui-qa-browser.yml]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare the matching open-source headless Chromium for local UI verification
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/voiceline-ui-tools" --no-audit --no-fund --ignore-scripts playwright-core@1.62.1
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/voiceline-ui-browsers"
          node "$RUNNER_TEMP/voiceline-ui-tools/node_modules/playwright-core/cli.js" install --only-shell chromium
          XZ_OPT='-T2 -1' tar -cJf ui-browser.tar.xz -C "$PLAYWRIGHT_BROWSERS_PATH" .
          sha256sum ui-browser.tar.xz > UI-BROWSER-SHA256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: VoiceLine-UI-QA-Browser
          path: |
            ui-browser.tar.xz
            UI-BROWSER-SHA256.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
