name: VoiceLine Local91 exact APK update verification
on:
  push:
    branches: [build/android-apk]
    paths: [.github/workflows/verify-local91-android.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN_ID: '43822736739'
      SOURCE_COMMIT: 289c67ee6fa0e94ce19d2f2415925bcc91f32e9b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify unchanged app source and original build evidence
        shell: bash
        run: |
          git fetch --depth=1 origin "$SOURCE_COMMIT"
          git diff --exit-code "$SOURCE_COMMIT" HEAD -- android-local44
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" > source-run.json
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID/jobs" > source-jobs.json
          gh run download "$SOURCE_RUN_ID" --repo "$GH_REPO" --name VoiceLine-Local91-Verification --dir verified
          cp -R verified/dist dist
          python3 - <<'PY'
          import hashlib,json,os,re,zipfile
          from pathlib import Path
          run=json.loads(Path('source-run.json').read_text())
          assert run['head_sha']==os.environ['SOURCE_COMMIT']
          steps=json.loads(Path('source-jobs.json').read_text())['jobs'][0]['steps']
          for name in ['Run complete offline regression tests','Build and lint Local91 APK','Verify packaged source and matching Local90 signing certificate']:
              assert next(s for s in steps if s['name']==name)['conclusion']=='success',name
          info=json.loads(Path('dist/APK_VERIFIED.json').read_text())
          assert info['source_commit']==os.environ['SOURCE_COMMIT']
          assert info['version_code']==114 and info['same_signing_certificate']
          apk=Path('dist/VoiceLine-Local91-CI.apk')
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==info['apk_sha256']=='99805127a1a8f17d95d00df93ff5c5428b6a360028d6ef32b965e99f691e50e2'
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              assets=Path('android-local44/app/src/main/assets')
              generated={'www/third-party-notices.js','www/THIRD-PARTY-NOTICES.txt'}
              for p in assets.rglob('*'):
                  if p.is_file() and p.relative_to(assets).as_posix() not in generated:
                      assert z.read('assets/'+p.relative_to(assets).as_posix())==p.read_bytes(),str(p)
              # Gradle regenerates these two files from legal/third-party-base.json.
              # Verify that exact generated data, including the complete native notice.
              def notice_script(text):
                  start=text.index('const notices=')+len('const notices=')
                  end=text.index(';if(typeof module=',start)
                  return text[:start],json.loads(text[start:end]),text[end:]
              prefix,source_notices,suffix=notice_script((assets/'www/third-party-notices.js').read_text())
              actual_prefix,actual_notices,actual_suffix=notice_script(z.read('assets/www/third-party-notices.js').decode())
              expected_notices=json.loads(Path('android-local44/legal/third-party-base.json').read_text())+[source_notices[-1]]
              assert actual_prefix==prefix and actual_suffix==suffix and actual_notices==expected_notices
              expected_text='VoiceLine — Third-party software and sound recordings\n\n'+'\n\n'.join(n['name']+'\n'+n['license']+'\n'+n['source']+'\n\n'+n['text'] for n in expected_notices).rstrip()+'\n'
              assert z.read('assets/www/THIRD-PARTY-NOTICES.txt').decode()==expected_text
          target=json.loads(Path('verified/target-pitch-report/target-pitch.json').read_text())
          assert target['status']=='passed' and target['errors']==[] and len(target['checks'])==2
          language=json.loads(Path('verified/layout-report/language-report.json').read_text())
          assert language['leaks']==language['layoutProblems']==language['errors']==[]
          assert len(language['checks'])==15
          assert len(json.loads(Path('verified/layout-report/geometry.json').read_text()))==63
          units=Path('verified/unit-tests.txt').read_text()
          assert re.search(r'(?:ℹ|#) tests 419',units) and re.search(r'(?:ℹ|#) pass 419',units) and re.search(r'(?:ℹ|#) fail 0',units)
          print('Reusing the exact APK with all 419 unit tests, bilingual target tests, 15 English groups and 63 layout cases verified.')
          PY
      - name: Check original certificate and baseline APK
        shell: bash
        run: |
          mkdir -p release-review
          curl --fail --location --retry 3 --output release-review/previous-Local90-CI.apk https://github.com/sometime1992/voiceline-web/releases/download/voiceline-local90-rights-ci/VoiceLine-Local90-Safer-CI.apk
          echo '200d8369ff85aac3c20164d07adf497e74627a47f70d2f9c061b5ef362a772ae  release-review/previous-Local90-CI.apk' | sha256sum --check
          manager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          yes | "$manager" --licenses >/dev/null || true
          "$manager" --install 'build-tools;35.0.0'
          for apk in dist/VoiceLine-Local91-CI.apk release-review/previous-Local90-CI.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | grep -i "$(cat ci/android-debug-cert.sha256)"
          done
          python3 - <<'PY'
          import runpy,zipfile
          verify=runpy.run_path('ci/verify-third-party-notices.py')['verify']
          with zipfile.ZipFile('dist/VoiceLine-Local91-CI.apk') as z:
              print('Verified',verify(lambda name:z.read('assets/www/'+name)),'runtime component licenses in the exact APK')
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify exact APK update and retained Local90 data on Android 16
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: node ci/verify-local91-update.cjs
      - name: Prepare complete verified downloads
        shell: bash
        run: |
          cp android-upgrade-report/UPDATE_VERIFIED.json dist/
          cp verified/target-pitch-report/target-pitch.json dist/TARGET_PITCH_VERIFIED.json
          cp verified/layout-report/language-report.json dist/LANGUAGE_VERIFIED.json
          cp verified/unit-tests.txt dist/
          sha256sum dist/VoiceLine-Local91-CI.apk > dist/SHA256SUMS.txt
          (cd dist && zip -q VoiceLine-Local91-CI.zip VoiceLine-Local91-CI.apk)
      - name: Keep final verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoiceLine-Local91-Verified-Update
          path: |
            dist/
            android-upgrade-report/
            source-run.json
            source-jobs.json
          retention-days: 14
      - name: Publish verified Local91
        shell: bash
        run: |
          gh release create voiceline-local91-target-pitch-ci --repo "$GH_REPO" --target "$SOURCE_COMMIT" \
            --title 'VoiceLine Local91 - Clear mic sensitivity and target-centered training' \
            --notes-file android-local44/docs/local91-release-notes.md \
            dist/VoiceLine-Local91-CI.apk dist/VoiceLine-Local91-CI.zip dist/SHA256SUMS.txt \
            dist/APK_VERIFIED.json dist/UPDATE_VERIFIED.json dist/TARGET_PITCH_VERIFIED.json dist/LANGUAGE_VERIFIED.json
