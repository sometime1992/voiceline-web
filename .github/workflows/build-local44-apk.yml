name: VoiceLine Local73 APK

on:
  push:
    branches: [build/android-apk]
    paths:
      - android-local44/**
      - ci/**
      - store-kit/**
      - .github/workflows/build-local44-apk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voiceline-local44-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VOICELINE_CI_KEYSTORE: ${{ github.workspace }}/.ci-signing/debug.keystore
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify public studio homepage, privacy and support
        shell: bash
        run: |
          for page in '' apps/voiceline/privacy.html 'support.html?app=voiceline'; do
            curl --fail --location --proto '=https' --retry 2 --max-time 45 --output "$RUNNER_TEMP/studio-page.html" "https://mindup-studio.pages.dev/$page"
            grep -q '마인드업 스튜디오' "$RUNNER_TEMP/studio-page.html"
          done
      - name: Test recording, dynamics calibration, training and adaptive layout
        timeout-minutes: 3
        working-directory: android-local44
        shell: bash
        run: |
          node ../ci/build-privacy-policy.cjs
          git diff --exit-code -- app/src/main/assets/www/privacy-policy.js app/src/main/assets/www/privacy.html
          node --test --test-concurrency=1 --test-timeout=60000 local_tests/*.test.cjs 2>&1 | tee local44-tests.log
      - name: Keep regression test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VoiceLine-Local73-Test-Report
          path: android-local44/local44-tests.log
          if-no-files-found: warn
          retention-days: 7
      - name: Check every keyboard size and live graph in Chromium
        timeout-minutes: 15
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/voiceline-layout" --no-audit --no-fund --ignore-scripts playwright-core
          export NODE_PATH="$RUNNER_TEMP/voiceline-layout/node_modules"
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          node ci/check-piano-layout.cjs
          node ci/render-store-graphic.cjs
      - name: Keep keyboard layout and graph report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VoiceLine-Local73-Layout-Report
          path: layout-report/
          if-no-files-found: warn
          retention-days: 7
      - name: Ensure Android SDK 36 packages
        shell: bash
        run: |
          sdk_manager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -x "$sdk_manager"
          yes | "$sdk_manager" --licenses >/dev/null || true
          "$sdk_manager" --install "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Restore CI debug signing key
        uses: actions/cache@v6
        with:
          path: ${{ env.VOICELINE_CI_KEYSTORE }}
          key: voiceline-ci45-debug-signing-v1
      - name: Prepare explicit CI signing key
        shell: bash
        run: |
          if [ ! -s "$VOICELINE_CI_KEYSTORE" ]; then
            if [ -f ci/android-debug-cert.sha256 ]; then
              echo '::error::The CI signing key cache is missing. Restore the existing key before building an update.'
              exit 1
            fi
            mkdir -p "$(dirname "$VOICELINE_CI_KEYSTORE")"
            keytool -genkeypair -keystore "$VOICELINE_CI_KEYSTORE" -alias androiddebugkey -storepass android -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Build separately installable CI APK
        working-directory: android-local44
        run: gradle --no-daemon :app:assembleCiDebug
      - name: Verify signatures, package IDs, version and every offline asset
        run: python3 ci/verify-local44-apks.py
      - name: Upload APKs and verification report
        uses: actions/upload-artifact@v7
        with:
          name: VoiceLine-Local73-APKs
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Check unsigned release AAB and Android lint
        working-directory: android-local44
        run: gradle --no-daemon :app:bundleRelease :app:lintRelease
      - name: Verify release-review bundle assets
        run: python3 ci/verify-release-readiness.py
      - name: Validate production bundle and prepare emulator review APK
        shell: bash
        run: |
          bundletool_jar="$RUNNER_TEMP/bundletool-all-1.18.2.jar"
          curl --fail --location --retry 3 --output "$bundletool_jar" https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
          echo "378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584  $bundletool_jar" | sha256sum --check
          export VOICELINE_BUNDLETOOL_JAR="$bundletool_jar"
          python3 ci/verify-app-bundle.py
          curl --fail --location --retry 3 --output release-review/previous-Local72-CI.apk https://github.com/sometime1992/voiceline-web/releases/download/voiceline-local72-ci/VoiceLine-Local72-CI.apk
          echo '14dec1d732a5520e6d69879d172590015a7a9e5a3386b333c1683bb9ab57513a  release-review/previous-Local72-CI.apk' | sha256sum --check
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 production smoke test and store screenshots
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 ci/android-release-smoke.py
      - name: Verify store media dimensions
        run: python3 ci/verify-store-media.py
      - name: Keep Android runtime and store media reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VoiceLine-Local73-Store-Media
          path: |
            store-media/
            android-smoke/
          if-no-files-found: warn
          retention-days: 7
      - name: Keep release-readiness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VoiceLine-Local73-Release-Readiness
          path: |
            release-review/
            android-local44/app/build/reports/lint-results-release.*
          if-no-files-found: warn
          retention-days: 7
