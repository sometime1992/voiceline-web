name: VoiceLine Local47 APK

on:
  push:
    branches: [build/android-apk]
    paths:
      - android-local44/**
      - ci/**
      - .github/workflows/build-local44-apk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voiceline-local44-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VOICELINE_CI_KEYSTORE: ${{ github.workspace }}/.ci-signing/debug.keystore
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test recording, training, metronome and adaptive layout
        timeout-minutes: 3
        working-directory: android-local44
        shell: bash
        run: node --test --test-concurrency=1 --test-timeout=60000 local_tests/*.test.cjs 2>&1 | tee local44-tests.log
      - name: Keep regression test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VoiceLine-Local47-Test-Report
          path: android-local44/local44-tests.log
          if-no-files-found: warn
          retention-days: 7
      - name: Check every keyboard size and live graph in Chromium
        timeout-minutes: 4
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/voiceline-layout" --no-audit --no-fund --ignore-scripts playwright-core
          export NODE_PATH="$RUNNER_TEMP/voiceline-layout/node_modules"
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          node ci/check-piano-layout.cjs
      - name: Keep keyboard layout and graph report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VoiceLine-Local47-Layout-Report
          path: layout-report/
          if-no-files-found: warn
          retention-days: 7
      - name: Ensure Android SDK 35 packages
        shell: bash
        run: |
          sdk_manager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -x "$sdk_manager"
          yes | "$sdk_manager" --licenses >/dev/null || true
          "$sdk_manager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
      - name: Restore CI debug signing key
        uses: actions/cache@v6
        with:
          path: ${{ env.VOICELINE_CI_KEYSTORE }}
          key: voiceline-ci45-debug-signing-v1
      - name: Prepare explicit CI signing key
        shell: bash
        run: |
          if [ ! -s "$VOICELINE_CI_KEYSTORE" ]; then
            if [ -f ci/android-debug-cert.sha256 ]; then
              echo '::error::The CI signing key cache is missing. Restore the existing key before building an update.'
              exit 1
            fi
            mkdir -p "$(dirname "$VOICELINE_CI_KEYSTORE")"
            keytool -genkeypair -keystore "$VOICELINE_CI_KEYSTORE" -alias androiddebugkey -storepass android -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Build separately installable CI APK
        working-directory: android-local44
        run: gradle --no-daemon :app:assembleCiDebug
      - name: Verify signatures, package IDs, version and every offline asset
        run: python3 ci/verify-local44-apks.py
      - name: Upload APKs and verification report
        uses: actions/upload-artifact@v7
        with:
          name: VoiceLine-Local47-APKs
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
