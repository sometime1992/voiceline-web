# Publish the exact APK from the complete verified Local75 source snapshot.
name: VoiceLine Local75 direct downloads

on:
  push:
    branches: [build/android-apk]
    paths: [.github/workflows/publish-local75-download.yml]
  workflow_dispatch:

permissions: {}

jobs:
  downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: voiceline-local75-ci
      SOURCE_RUN_ID: '41653081316'
      SOURCE_COMMIT: 143da1f9f7528e486fba71cdb8617d918fa22af7
    steps:
      - name: Verify complete build and Android results before publishing
        run: |
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" > source-run.json
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID/jobs" > source-jobs.json
          gh api "repos/$GH_REPO/compare/$SOURCE_COMMIT...$GITHUB_SHA" > publication-compare.json
          gh run download "$SOURCE_RUN_ID" --repo "$GH_REPO" --name VoiceLine-Local75-Store-Media --dir verified-media
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run=json.loads(Path('source-run.json').read_text())
          assert run['head_sha']==os.environ['SOURCE_COMMIT']
          assert run['status']=='completed' and run['conclusion']=='success'
          comparison=json.loads(Path('publication-compare.json').read_text())
          assert comparison['status'] in ('ahead','identical')
          assert not any(f['filename'].startswith('android-local44/') for f in comparison['files']), 'App changed since verification'
          jobs=json.loads(Path('source-jobs.json').read_text())['jobs']
          steps=next(j['steps'] for j in jobs if j['name']=='apk')
          required=['Verify public studio homepage, privacy and support','Test recording, dynamics calibration, training and adaptive layout','Check every keyboard size and live graph in Chromium','Build separately installable CI APK','Verify signatures, package IDs, version and every offline asset','Check unsigned release AAB and Android lint','Verify release-review bundle assets','Validate production bundle and prepare emulator review APK','Android 16 production smoke test and store screenshots','Verify store media dimensions']
          for name in required:
              assert next(s for s in steps if s['name']==name)['conclusion']=='success',name
          qa=Path('verified-media/android-smoke')
          assert json.loads((qa/'ANDROID16_SMOKE.json').read_text())['status']=='passed'
          update=json.loads((qa/'CI_INSTALL_NAME.json').read_text())
          assert update['status']=='passed'
          assert update['before_version']=='2.0.0-local74-ci (89)'
          assert update['after_version']=='2.0.0-local75-ci (90)'
          assert update['update_installed_without_uninstall'] and update['private_test_file_preserved']
          PY
      - name: Download and verify the exact tested APK
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "$GH_REPO" --name VoiceLine-Local75-APKs --dir dist
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          dist=Path('dist')
          apk=dist/'VoiceLine-Local75-CI.apk'
          verified=json.loads((dist/'APK_LABEL_VERIFIED.json').read_text())
          assert verified['source_commit']==os.environ['SOURCE_COMMIT']
          assert verified['version_name']=='2.0.0-local75-ci' and verified['version_code']==90
          assert verified['package']=='com.voiceline.app.local18.ci45'
          assert verified['certificate_sha256']=='e0bc85a5900a64eee520a444e80db3844a4b9372c172ab021e0944d239ce429c'
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==verified['apk_sha256']
          with zipfile.ZipFile(apk) as archive:
              assert archive.testzip() is None
          assert os.environ['SOURCE_COMMIT'] in (dist/'BUILD_INFO.txt').read_text()
          package=dist/'VoiceLine-Local75-CI.zip'
          with zipfile.ZipFile(package,'w',zipfile.ZIP_DEFLATED) as archive:
              entry=zipfile.ZipInfo(apk.name,date_time=(2026,11,3,0,0,0))
              entry.compress_type=zipfile.ZIP_DEFLATED
              archive.writestr(entry,apk.read_bytes())
          (dist/'SHA256SUMS.txt').write_text('\n'.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name for p in [apk,package])+'\n')
          PY
      - name: Create public test download links
        run: |
          cat > release-notes.md <<'NOTES'
          ## VoiceLine Local75 · 기본 측정·녹음 설정 제거

          - 기본 음정 측정·녹음 화면의 연습 설정 버튼 제거
          - 두 기능의 과거 설정창 진입 경로도 차단
          - 저장돼 있던 자동 종료 시간·반복 횟수·쉬는 시간은 적용하지 않음
          - 음정 측정과 녹음은 직접 중단할 때까지 진행, 녹음 중단 시 한 파일 저장
          - 공통 마이크 감도, 기존 녹음 파일·기록과 나머지 연습 설정 유지
          - 루틴에서 두 기능을 제외한 상태와 세로·가로 스크롤 팝업 유지
          - 기능·화면·Android16·업데이트 설치 검증 후 동일 APK 배포
          - 버전 2.0.0-local75-ci (90), 기존 CI 인증서·패키지 유지

          앱 소스: https://github.com/sometime1992/voiceline-web/commit/143da1f9f7528e486fba71cdb8617d918fa22af7
          검증: https://github.com/sometime1992/voiceline-web/actions/runs/41653081316

          APK 다운로드가 막히면 ZIP을 풀어 안의 동일 APK를 설치하세요. 기존 CI 앱 위에 업데이트 설치합니다. 실제 S24 Ultra 실기기 검사는 수행하지 않았습니다.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --prerelease --title 'VoiceLine Local75 기본 측정·녹음 설정 제거 APK' --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" --repo "$GH_REPO" --clobber dist/VoiceLine-Local75-CI.apk dist/VoiceLine-Local75-CI.zip dist/BUILD_INFO.txt dist/APK_LABEL_VERIFIED.json dist/SHA256SUMS.txt
          else
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --prerelease --title 'VoiceLine Local75 기본 측정·녹음 설정 제거 APK' --notes-file release-notes.md dist/VoiceLine-Local75-CI.apk dist/VoiceLine-Local75-CI.zip dist/BUILD_INFO.txt dist/APK_LABEL_VERIFIED.json dist/SHA256SUMS.txt
          fi
      - name: Verify public downloads without authentication
        run: |
          mkdir -p "$RUNNER_TEMP/public-download-check"
          for filename in VoiceLine-Local75-CI.apk VoiceLine-Local75-CI.zip; do
            curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 --output "$RUNNER_TEMP/public-download-check/$filename" "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$filename"
          done
          cd "$RUNNER_TEMP/public-download-check"
          sha256sum --check "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"
      - name: Keep the verified public download files
        uses: actions/upload-artifact@v7
        with:
          name: VoiceLine-Local75-Public-Downloads
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
