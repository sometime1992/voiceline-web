name: VoiceLine Local70 direct downloads

on:
  push:
    branches: [build/android-apk]
    paths: [.github/workflows/publish-local70-download.yml]
  workflow_dispatch:

permissions: {}

jobs:
  downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: voiceline-local70-ci
      SOURCE_RUN_ID: '41580667247'
      SOURCE_COMMIT: d6c72ac7000cc31e364fb48949b17f699fda34ff
      ANDROID_RUN_ID: '41584587302'
      ANDROID_COMMIT: 278461ce764af9e3d751676841446f22971c2c48
    steps:
      - name: Verify complete app checks and exact APK Android results
        run: |
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID" > source-run.json
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID/jobs" > source-jobs.json
          gh api "repos/$GH_REPO/compare/$SOURCE_COMMIT...$GITHUB_SHA" > publication-compare.json
          gh api "repos/$GH_REPO/actions/runs/$ANDROID_RUN_ID" > android-run.json
          gh run download "$ANDROID_RUN_ID" --repo "$GH_REPO" --name VoiceLine-Local70-Android-Verified --dir verified-media
          python3 - <<'PY_VERIFY'
          import json, os
          from pathlib import Path
          run=json.loads(Path('source-run.json').read_text())
          assert run['head_sha']==os.environ['SOURCE_COMMIT'] and run['status']=='completed'
          comparison=json.loads(Path('publication-compare.json').read_text())
          assert comparison['status'] in ('ahead','identical')
          assert not any(f['filename'].startswith('android-local44/') for f in comparison['files']), 'App changed since verification'
          jobs=json.loads(Path('source-jobs.json').read_text())['jobs']
          steps=next(j['steps'] for j in jobs if j['name']=='apk')
          required=['Verify public studio homepage, privacy and support','Test recording, dynamics calibration, training and adaptive layout','Check every keyboard size and live graph in Chromium','Build separately installable CI APK','Verify signatures, package IDs, version and every offline asset','Check unsigned release AAB and Android lint','Verify release-review bundle assets','Validate production bundle and prepare emulator review APK']
          for name in required:
              assert next(s for s in steps if s['name']==name)['conclusion']=='success',name
          assert [s['name'] for s in steps if s['conclusion']=='failure']==['Android 16 production smoke test and store screenshots']
          native=json.loads(Path('android-run.json').read_text())
          assert native['conclusion']=='success' and native['head_sha']==os.environ['ANDROID_COMMIT']
          qa=Path('verified-media/android-smoke')
          facts=json.loads((qa/'EXACT_APK_VERIFICATION.json').read_text())
          assert facts['status']=='passed' and facts['app_sources_unchanged'] is True
          assert facts['app_source_commit']==os.environ['SOURCE_COMMIT']
          assert str(facts['app_build_run'])==os.environ['SOURCE_RUN_ID']
          assert str(facts['verification_run'])==os.environ['ANDROID_RUN_ID'] and facts['verification_commit']==os.environ['ANDROID_COMMIT']
          assert facts['apk_sha256']=='4f58f552d9cb7500f5f1ae2f8e7ea8df202e437d41e24a9d9c714a5524594daa'
          assert json.loads((qa/'ANDROID16_SMOKE.json').read_text())['status']=='passed'
          update=json.loads((qa/'CI_INSTALL_NAME.json').read_text())
          assert update['status']=='passed'
          assert update['before_version']=='2.0.0-local69-ci (84)'
          assert update['after_version']=='2.0.0-local70-ci (85)'
          assert update['update_installed_without_uninstall'] and update['private_test_file_preserved']
          PY_VERIFY
      - name: Download and verify the exact tested APK
        run: |
          gh run download "$SOURCE_RUN_ID" --repo "$GH_REPO" --name VoiceLine-Local70-APKs --dir dist
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          dist=Path('dist')
          apk=dist/'VoiceLine-Local70-CI.apk'
          verified=json.loads((dist/'APK_LABEL_VERIFIED.json').read_text())
          assert verified['source_commit']==os.environ['SOURCE_COMMIT']
          assert verified['version_name']=='2.0.0-local70-ci' and verified['version_code']==85
          assert verified['package']=='com.voiceline.app.local18.ci45'
          assert verified['certificate_sha256']=='e0bc85a5900a64eee520a444e80db3844a4b9372c172ab021e0944d239ce429c'
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==verified['apk_sha256']
          with zipfile.ZipFile(apk) as archive:
              assert archive.testzip() is None
          assert os.environ['SOURCE_COMMIT'] in (dist/'BUILD_INFO.txt').read_text()
          package=dist/'VoiceLine-Local70-CI.zip'
          with zipfile.ZipFile(package,'w',zipfile.ZIP_DEFLATED) as archive:
              entry=zipfile.ZipInfo(apk.name,date_time=(2026,11,3,0,0,0))
              entry.compress_type=zipfile.ZIP_DEFLATED
              archive.writestr(entry,apk.read_bytes())
          (dist/'SHA256SUMS.txt').write_text('\n'.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name for p in [apk,package])+'\n')
          PY
      - name: Create public test download links
        run: |
          cat > release-notes.md <<'NOTES'
          ## VoiceLine Local70 · 음량 입력 오류 표시 수정

          - 음량을 잘못 직접 입력한 뒤 슬라이더로 정상값을 선택하면 오류 문구도 즉시 해제
          - 가이드·건반·기준음·메트로놈·전환 안내음에 동일한 검증 경로 적용
          - 기존 밝은 UI와 한 페이지 상세 설정 유지
          - Android 자동 검사에서 실제 입력창 식별자를 우선하고 긴 연습 목록 탐색 보완
          - 에뮬레이터 저장 공간을 명시하여 검사 서버의 공간 부족 문제 보완
          - 버전 2.0.0-local70-ci (85), 설치 이름 VoiceLine
          - 기존 CI 인증서·패키지를 유지하며 Local69에서 삭제 없는 업데이트와 시험 데이터 보존 검증
          - 기능·화면·Android16·정식 구성 lint 검사 통과 후 같은 APK를 배포

          앱 소스: https://github.com/sometime1992/voiceline-web/commit/d6c72ac7000cc31e364fb48949b17f699fda34ff
          빌드·화면 검증: https://github.com/sometime1992/voiceline-web/actions/runs/41580667247
          동일 APK Android 검증: https://github.com/sometime1992/voiceline-web/actions/runs/41584587302

          APK 다운로드가 막히면 ZIP을 풀어 안의 APK를 실행하세요. 실제 S24 Ultra 검사는 미수행이며 Play Console 업로드·심사 제출은 수행하지 않았습니다.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --prerelease --title 'VoiceLine Local70 음량 입력 표시 수정 APK' --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" --repo "$GH_REPO" --clobber dist/VoiceLine-Local70-CI.apk dist/VoiceLine-Local70-CI.zip dist/BUILD_INFO.txt dist/APK_LABEL_VERIFIED.json dist/SHA256SUMS.txt
          else
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --prerelease --title 'VoiceLine Local70 음량 입력 표시 수정 APK' --notes-file release-notes.md dist/VoiceLine-Local70-CI.apk dist/VoiceLine-Local70-CI.zip dist/BUILD_INFO.txt dist/APK_LABEL_VERIFIED.json dist/SHA256SUMS.txt
          fi
      - name: Verify public downloads without authentication
        run: |
          mkdir -p "$RUNNER_TEMP/public-download-check"
          for filename in VoiceLine-Local70-CI.apk VoiceLine-Local70-CI.zip; do
            curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 --output "$RUNNER_TEMP/public-download-check/$filename" "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$filename"
          done
          cd "$RUNNER_TEMP/public-download-check"
          sha256sum --check "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"
      - name: Keep the verified public download files
        uses: actions/upload-artifact@v7
        with:
          name: VoiceLine-Local70-Public-Downloads
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
