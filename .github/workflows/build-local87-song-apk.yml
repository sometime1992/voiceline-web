name: VoiceLine Local88 Original UI Song APK
on:
  push:
    branches: [feature/voiceline-local88-song, build/android-apk]
    paths:
      - android-local44/**
      - .github/workflows/build-local87-song-apk.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VOICELINE_CI_KEYSTORE: ${{ github.workspace }}/.ci-signing/debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Syntax and original piano UI
        shell: bash
        run: |
          node --check android-local44/app/src/main/assets/www/piano.js
          node --check android-local44/app/src/main/assets/www/song-practice.js
          grep -q 'id="songYoutube"' android-local44/app/src/main/assets/www/index.html
          grep -q 'id="songMR"' android-local44/app/src/main/assets/www/index.html
          test -s android-local44/app/src/main/assets/www/vendor/tone-piano.js
          grep -q 'id="keyboard"' android-local44/app/src/main/assets/www/index.html
          grep -q 'id="songGraphOverlay"' android-local44/app/src/main/assets/www/index.html
      - name: Ensure SDK 36
        shell: bash
        run: |
          sdk_manager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -x "$sdk_manager"
          yes | "$sdk_manager" --licenses >/dev/null || true
          "$sdk_manager" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Restore original CI signing key
        uses: actions/cache@v4
        with:
          path: ${{ env.VOICELINE_CI_KEYSTORE }}
          key: voiceline-ci45-debug-signing-v1
      - name: Require original signing certificate
        shell: bash
        run: |
          test -s "$VOICELINE_CI_KEYSTORE" || { echo "::error::Original CI key unavailable; refusing a differently signed APK"; exit 1; }
      - name: Build Local88 CI APK
        working-directory: android-local44
        run: gradle --no-daemon :app:assembleCiDebug
      - name: Check APK contents and original signing certificate
        shell: bash
        run: |
          mkdir -p dist
          apk="$(find android-local44/app/build/outputs/apk/ciDebug -name '*.apk' -print -quit)"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "name='com.voiceline.app.local18.ci45'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "versionCode='111'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "versionName='2.0.0-local88-ci'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | tee dist/cert-check.txt
          pinned="$(cat ci/android-debug-cert.sha256)"
          grep -qi "$pinned" dist/cert-check.txt
          python3 - "$apk" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as f:
              assert f.testzip() is None
              for name in ['assets/www/index.html','assets/www/piano.js','assets/www/song-practice.js','assets/www/song-practice.css']:
                  assert name in f.namelist(), name
              assert b'id="keyboard"' in f.read('assets/www/index.html')
              assert b'id="songGraphOverlay"' in f.read('assets/www/index.html')
          PY
          cp "$apk" dist/VoiceLine-Local88-Song-CI.apk
          sha256sum dist/VoiceLine-Local88-Song-CI.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceLine-Local88-OriginalUI-Song-APK
          path: dist/
          retention-days: 7
