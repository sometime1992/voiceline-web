plugins { id 'com.android.application' }

android {
    namespace 'com.voiceline.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.voiceline.app'
        minSdk 26
        targetSdk 35
        versionCode 63
        versionName '2.0.0-local48'
    }

    signingConfigs {
        ciSigning {
            def keyPath = System.getenv('VOICELINE_CI_KEYSTORE')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            // Standalone debug install; does not alter previous Beta15 recordings.
            applicationIdSuffix '.local18'
        }
        release { minifyEnabled false }
        // Separate CI installation keeps a PC-signed app and its recordings intact.
        ciDebug {
            initWith debug
            applicationIdSuffix '.local18.ci45'
            versionNameSuffix '-ci'
            matchingFallbacks = ['debug']
            if (System.getenv('VOICELINE_CI_KEYSTORE')) {
                signingConfig signingConfigs.ciSigning
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
// All offline HTML, JS, CSS, piano samples and engine are already embedded
// in app/src/main/assets/www. No npm asset downloads are necessary.
