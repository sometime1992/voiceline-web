plugins { id 'com.android.application' }

android {
    namespace 'com.voiceline.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.voiceline.app'
        minSdk 26
        targetSdk 36
        versionCode 75
        versionName '2.0.0'
    }

    signingConfigs {
        ciSigning {
            def keyPath = System.getenv('VOICELINE_CI_KEYSTORE')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        if (System.getenv('VOICELINE_UPLOAD_KEYSTORE')) {
            uploadSigning {
                storeFile file(System.getenv('VOICELINE_UPLOAD_KEYSTORE'))
                storePassword System.getenv('VOICELINE_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('VOICELINE_UPLOAD_KEY_ALIAS') ?: 'voiceline-upload'
                keyPassword System.getenv('VOICELINE_UPLOAD_KEY_PASSWORD') ?: System.getenv('VOICELINE_UPLOAD_STORE_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            // Standalone debug install; does not alter previous Beta15 recordings.
            applicationIdSuffix '.local18'
            versionNameSuffix '-local61'
        }
        release {
            minifyEnabled false
            debuggable false
            if (System.getenv('VOICELINE_UPLOAD_KEYSTORE')) signingConfig signingConfigs.uploadSigning
        }
        // Separate CI installation keeps a PC-signed app and its recordings intact.
        ciDebug {
            initWith debug
            applicationIdSuffix '.local18.ci45'
            versionNameSuffix '-local61-ci'
            matchingFallbacks = ['debug']
            if (System.getenv('VOICELINE_CI_KEYSTORE')) {
                signingConfig signingConfigs.ciSigning
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// CI updates have their own package and version sequence; release is 2.0.0 (75).
androidComponents {
    onVariants(selector().withBuildType('ciDebug')) { variant ->
        variant.outputs.each { output -> output.versionCode.set(76) }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
// All offline HTML, JS, CSS, piano samples and engine are already embedded
// in app/src/main/assets/www. No npm asset downloads are necessary.
